<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hotarubi — 競技かるた練習システム</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg: #0f0d0a;
        --bg2: #1a1510;
        --bg3: #241e15;
        --border: #3a2e1e;
        --accent: #c8900a;
        --accent2: #f0d060;
        --text: #e8dcc8;
        --text2: #b89060;
        --text3: #7a5a30;
        --tab-h: 44px;
        font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      }

      html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }

      /* ======= タブバー ======= */
      #tab-bar {
        display: flex;
        height: var(--tab-h);
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        overflow-x: auto;
        scrollbar-width: none;
      }
      #tab-bar::-webkit-scrollbar { display: none; }

      .tab-btn {
        flex-shrink: 0;
        padding: 0 16px;
        height: 100%;
        border: none;
        background: transparent;
        color: var(--text3);
        font-family: inherit;
        font-size: 13px;
        letter-spacing: 0.08em;
        cursor: pointer;
        border-right: 1px solid var(--border);
        white-space: nowrap;
        transition: background 0.15s, color 0.15s;
        position: relative;
      }
      .tab-btn:hover { background: var(--bg3); color: var(--text2); }
      .tab-btn.active { color: var(--accent2); background: var(--bg); }
      .tab-btn.active::after {
        content: '';
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 2px;
        background: var(--accent);
      }

      /* 投影ウィンドウを開くボタン（タブではなく常設。どのタブからでも押せる） */
      #btn-open-projection {
        margin-left: auto;
        align-self: center;
        margin-right: 10px;
        flex-shrink: 0;
        padding: 5px 14px;
        font-size: 12px;
      }

      /* ======= コンテンツエリア ======= */
      #app { display: flex; flex-direction: column; width: 100%; height: 100%; }
      #content { flex: 1; overflow: hidden; position: relative; }

      /* 通常ビュー（スクロール可） */
      .view {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        padding: 20px;
        display: none;
      }
      .view.active { display: block; }

      /* スプリットビュー（左右） */
      .view.split-h { padding: 0; overflow: hidden; }
      .view.split-h.active { display: flex; flex-direction: row; }
      .split-pane-v {
        overflow-y: auto;
        padding: 16px;
        border-right: 1px solid var(--border);
      }
      .split-pane-v:last-child { border-right: none; }
      .split-pane-fill { flex: 1; overflow: hidden; }

      /* スプリットビュー（上下） */
      .view.split-v { padding: 0; overflow: hidden; }
      .view.split-v.active { display: flex; flex-direction: column; }
      .split-top {
        flex-shrink: 0;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        overflow-y: auto;
        max-height: 35%;
      }
      .split-bottom { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

      /* ======= 共通コンポーネント ======= */
      .section-title {
        font-size: 15px;
        color: var(--accent2);
        letter-spacing: 0.15em;
        margin-bottom: 14px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border-radius: 6px;
        padding: 7px 16px;
        font-size: 13px;
        letter-spacing: 0.06em;
        border: 1.5px solid var(--border);
        background: var(--bg3);
        color: var(--text);
        transition: all 0.15s;
      }
      button:hover { border-color: var(--accent); color: var(--accent2); }
      button.primary {
        background: linear-gradient(135deg, #8b4a00, #b86000);
        border-color: var(--accent);
        color: #f5e8c0;
      }
      button:disabled { opacity: 0.4; cursor: not-allowed; }

      input, select {
        font-family: inherit;
        background: var(--bg2);
        border: 1.5px solid var(--border);
        color: var(--text);
        border-radius: 5px;
        padding: 5px 10px;
        font-size: 13px;
      }
      input:focus, select:focus { outline: none; border-color: var(--accent); }

      label { font-size: 12px; color: var(--text2); letter-spacing: 0.06em; }

      .form-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .form-row label { min-width: 100px; }

      /* ======= ローディング ======= */
      #loading {
        position: fixed; inset: 0;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        z-index: 9999;
        font-size: 14px;
        color: var(--text2);
        letter-spacing: 0.12em;
      }
      #loading.hidden { display: none; }
      .spinner {
        width: 32px; height: 32px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ======= モーダル ======= */
      #modal-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.8);
        z-index: 500;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #modal-overlay.visible { display: flex; }
      #modal-box {
        background: var(--bg2);
        border: 1px solid #6a4a18;
        border-radius: 12px;
        width: min(500px, 92vw);
        max-height: 85vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #modal-header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #modal-title { font-size: 14px; color: var(--accent2); letter-spacing: 0.1em; }
      #modal-close { background: none; border: none; color: var(--text3); font-size: 20px; padding: 0 4px; line-height: 1; }
      #modal-close:hover { color: var(--text); }
      #modal-body {
        flex: 1; overflow-y: auto; padding: 12px;
        scrollbar-width: thin; scrollbar-color: var(--border) var(--bg2);
      }
      #modal-search-input {
        width: 100%; margin-bottom: 10px; padding: 6px 10px;
        background: var(--bg); border: 1.5px solid var(--border);
        color: var(--text); border-radius: 6px; font-family: inherit; font-size: 13px;
      }
      #modal-search-input:focus { outline: none; border-color: var(--accent); }
      #modal-grid { display: flex; flex-direction: column; gap: 9px; }
      .modal-group { display: flex; align-items: flex-start; gap: 8px; }
      .modal-group-head {
        flex-shrink: 0; width: 22px; text-align: center;
        font-size: 15px; color: var(--accent2);
        border-right: 1px solid var(--border); padding-right: 6px; line-height: 1.6;
      }
      .modal-group-cards { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
      .modal-card-btn {
        padding: 5px 8px; font-size: 11px; letter-spacing: 0.04em;
        min-width: 40px; text-align: center;
        background: var(--bg3); border: 1px solid var(--border);
        color: var(--text2); border-radius: 4px;
      }
      .modal-card-btn:hover { border-color: var(--accent); color: var(--accent2); }
      .modal-card-btn.selected {
        background: linear-gradient(135deg, #8b4a00, #b86000);
        border-color: var(--accent); color: #f5e8c0;
      }

      #modal-footer {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-top: 1px solid var(--border);
      }
      #modal-footer.visible { display: flex; }
      #modal-count { font-size: 12px; color: var(--accent2); white-space: nowrap; }
      #modal-footer button { font-size: 11px; padding: 4px 10px; }

      /* ======= トースト ======= */
      #toast {
        position: fixed; bottom: 20px; left: 50%;
        transform: translateX(-50%) translateY(60px);
        background: var(--bg3); border: 1px solid var(--accent);
        color: var(--accent2); padding: 8px 20px; border-radius: 20px;
        font-size: 13px; letter-spacing: 0.06em;
        z-index: 800; transition: transform 0.25s ease;
        pointer-events: none; white-space: nowrap;
      }
      #toast.show { transform: translateX(-50%) translateY(0); }

      /* ======= モード選択ボタン ======= */
      .mode-btn {
        display: flex; flex-direction: column; align-items: center;
        gap: 6px; padding: 20px 32px;
        font-size: 18px; letter-spacing: 0.12em;
        border: 2px solid var(--border);
        border-radius: 12px;
        background: var(--bg2);
        color: var(--text);
        transition: all 0.2s;
        min-width: 160px;
      }
      .mode-btn:hover { border-color: var(--accent); color: var(--accent2); background: var(--bg3); }
      .mode-btn small { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <span>hotarubi を起動中...</span>
    </div>

    <div id="app">
      <nav id="tab-bar">
        <button class="tab-btn active" data-tab="calibration">投影調整</button>
        <button class="tab-btn" data-tab="camera">カメラ</button>
        <button class="tab-btn" data-tab="play">競技</button>
        <button id="btn-open-projection" title="投影用の表示専用ウィンドウを開きます">投影ウィンドウ</button>
      </nav>

      <div id="content">

        <!-- ===== ① 投影調整（初期設定） ===== -->
        <div class="view active" id="view-calibration">
          <p class="section-title">投影調整</p>
          <div id="calibration-ui"></div>
        </div>

        <!-- ===== カメラ（プレイヤー | 姿勢推定） ===== -->
        <div class="view split-h" id="view-camera">
          <div class="split-pane-v" style="width:330px;flex-shrink:0;">
            <p class="section-title">プレイヤー</p>
            <p style="font-size:12px;color:var(--text3);margin-bottom:14px;line-height:1.7;">
              骨格の計測を記録するときだけ登録してください。
              投影と読み上げには不要です。
            </p>
            <div id="players-ui"></div>
          </div>
          <div id="camera-slot" class="split-pane-fill" style="overflow:hidden;padding:12px;"></div>
        </div>

        <!-- ===== 競技（読み上げ + ハイライト | 札配置） ===== -->
        <div class="view split-h" id="view-play">
          <div class="split-pane-v" style="width:330px;flex-shrink:0;">
            <p class="section-title" style="margin-bottom:12px;">読み上げ</p>
            <div id="play-reading-slot"></div>
            <p class="section-title" style="margin:20px 0 12px;">ハイライト</p>
            <div id="play-highlight-slot"></div>
          </div>
          <div class="split-pane-fill" style="display:flex;flex-direction:column;min-width:0;">
            <div id="arrange-toolbar" style="display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap;flex-shrink:0;align-items:center;border-bottom:1px solid var(--border);"></div>
            <div id="card-grid-container" style="flex:1;overflow:auto;padding:8px 12px;"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- 汎用モーダル -->
    <div id="modal-overlay">
      <div id="modal-box">
        <div id="modal-header">
          <span id="modal-title">札を選択</span>
          <button id="modal-close">×</button>
        </div>
        <div id="modal-body">
          <input type="text" id="modal-search-input" placeholder="決まり字で検索..." />
          <div id="modal-grid"></div>
        </div>
        <!-- 複数選択モードのときだけ表示 -->
        <div id="modal-footer">
          <span id="modal-count"></span>
          <span style="flex:1;"></span>
          <button id="modal-select-all">表示中を全選択</button>
          <button id="modal-clear-all">全解除</button>
          <button id="modal-done" class="primary">決定</button>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
